# money-brain collection / detection settings
years:
  start: 2002
  end: null          # null = current year
  refresh_last_n: 2  # re-collect the most recent N years every run (counts drift as indexes update)

sources:
  pubmed:
    enabled: true
    arms: [bio, tech]
    field: tiab          # title/abstract
  arxiv:
    enabled: true
    arms: [tech]
    field: abs
    sleep_seconds: 4     # arXiv asks >= 3 s between requests; 429s appeared at 3 s after ~90 calls
  edgar:
    enabled: true
    arms: [bio, tech]
    forms: "10-K"
    # denominator = exact "10-K" rows in the quarterly master index (full-index/<y>/QTR<n>/form.gz)
  clinicaltrials:
    enabled: true
    arms: [bio]
  uspto:
    enabled: true        # title-only counts via ODP API; auto-skips when USPTO_API_KEY is missing
    arms: [bio, tech]
  uspto_abs:
    enabled: true        # title+abstract counts, Google Patents public dataset on BigQuery
    arms: [bio, tech]    # run monthly by .github/workflows/bq.yml (collectors/patents_bq.py); needs GCP_SA_KEY

detector:
  # share = count / denominator * 1e6  (per million documents of that source/year)
  # sources whose Rule G signal defines "signal" for Tier assignment. Set to uspto_abs on 2026-11-05:
  # text sources (pubmed/arxiv/edgar) never led the earnings-call breakthrough on the 29-technology set,
  # and the title-only uspto series was too sparse (outputs/validation_notes_2026-11-03.md, addenda 1-4).
  signal_sources: [uspto_abs]
  min_count: 30            # ignore years with fewer raw documents than this (noise floor)
  growth_window_years: 2   # compare share[y] vs share[y - window]
  growth_threshold: 0.5    # +50 % over the window
  consecutive_hits: 2      # windows that must pass back-to-back for a signal
  # rule-selection grid: evaluated on validation rows (lead rate) and control rows (fire rate)
  grid:
    min_count: [10, 30]
    growth_threshold: [0.3, 0.5]
    consecutive_hits: [1, 2]
  # a control row is a valid negative only if its 10-K share did not rise much 2002-2019
  control_edgar_max_ratio: 3.0   # max(share 2005-2019) / mean(share 2002-2004) must be below this
  # provisional Tier thresholds for NEW candidates (no ec_year label). Re-tune after validation.
  tier:
    edgar_low_min: 10      # with a patent signal: 10-K mentions below this = "TW" (watch; nobody talks yet — Kalyani-set check 2026-11-11: disruptive 21% vs 69% for 10-49)
    edgar_low_max: 50      # 10-K mentions/yr in [edgar_low_min, this) with a signal = "T0" (market barely talking)
    edgar_high_min: 200    # at/above this = "already in the conversation" (Tier 2)

candidates:
  # candidate discovery over all patent bigrams (detector/candidates.py)
  min_assignees: 10   # distinct applicants using the bigram in the latest complete year; below this it is one family, not a technology
