name: portfolio

on:
  schedule:
    - cron: "0 4 * * 6"   # Saturdays 04:00 UTC — after Friday's US close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt yfinance
      - run: python -u portfolio/track.py
      - name: Commit
        run: |
          git config user.name "money-brain-bot"
          git config user.email "money-brain-bot@users.noreply.github.com"
          git add data/prices.csv outputs/portfolio.md
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "portfolio: weekly prices and NAV $(date -u +%F)"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 15; done
          fi
