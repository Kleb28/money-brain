name: collect-and-detect

on:
  schedule:
    - cron: "17 3 * * 1"      # every Monday 03:17 UTC (Mon 12:17 KST)
  workflow_dispatch:
    inputs:
      sources:
        description: "space-separated subset (pubmed arxiv edgar clinicaltrials uspto); empty = all"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
      USPTO_API_BASE: ${{ vars.USPTO_API_BASE }}
      EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect
        run: python -m collectors.run_all ${{ github.event.inputs.sources }}
      - name: Detect
        run: python -m detector.detector
      - name: Commit results
        run: |
          git config user.name "money-brain-bot"
          git config user.email "money-brain-bot@users.noreply.github.com"
          git add data/ outputs/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: weekly collection $(date -u +%F)"
            git push
          fi
