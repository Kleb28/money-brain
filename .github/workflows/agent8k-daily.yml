name: agent8k-daily

# Daily ledger for the 8-K Brief experiment; retires the paid endpoint when the
# survival balance hits zero. Mondays also write one proposed change (agent8k/reflections/).
on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger:
    if: ${{ vars.AGENT8K_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "anthropic>=2,<3"
      - run: python -u agent8k/ledger.py
        env:
          AGENT8K_URL: ${{ vars.AGENT8K_URL }}
          AGENT8K_START: ${{ vars.AGENT8K_START }}
          AGENT8K_STATS_TOKEN: ${{ secrets.AGENT8K_STATS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit
        run: |
          git config user.name "money-brain-bot"
          git config user.email "money-brain-bot@users.noreply.github.com"
          git add agent8k/ledger.md agent8k/reflections 2>/dev/null || git add agent8k/ledger.md
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "agent8k: ledger $(date -u +%F)"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 15; done
          fi
