name: theme-market

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u -m scripts.theme_market
      - name: Commit
        run: |
          git config user.name "money-brain-bot"
          git config user.email "money-brain-bot@users.noreply.github.com"
          git add outputs/theme_market.md outputs/theme_filers.csv data/external/theme_market_counts.csv
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "data: theme-level 10-K counts and filers $(date -u +%F)"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 15; done
          fi
