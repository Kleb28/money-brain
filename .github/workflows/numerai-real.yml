name: numerai-real-backtest

# Sim H (simulation/protocol.md): Numerai predictions traded on real US prices -> outputs/numerai_real_backtest.md
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-l55yf1]
    paths: [numerai/real_backtest.py, .github/workflows/numerai-real.yml]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numerapi pandas pyarrow numpy scipy scikit-learn lightgbm yfinance
      - run: python -u -m numerai.real_backtest
      - name: Commit
        run: |
          git config user.name "money-brain-bot"
          git config user.email "money-brain-bot@users.noreply.github.com"
          git add outputs/numerai_real_backtest.md
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "outputs: Sim H real-price backtest $(date -u +%F)"
            B="${GITHUB_REF_NAME}"
            for i in 1 2 3 4 5; do git pull --rebase origin "$B" && git push origin HEAD:"$B" && break; sleep 15; done
          fi
