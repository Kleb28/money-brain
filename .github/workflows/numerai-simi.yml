name: numerai-sim-i

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-0gha72]
    paths: [numerai/sim_i.py, .github/workflows/numerai-simi.yml]

permissions:
  contents: write

jobs:
  sim-i:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numerapi pandas pyarrow numpy scipy scikit-learn lightgbm
      - run: df -h / | tail -1; free -g | head -2
      - run: python -u -m numerai.sim_i
      - name: Commit to this branch
        run: |
          git config user.name "money-brain-bot"
          git config user.email "money-brain-bot@users.noreply.github.com"
          git add outputs/sim_i.md outputs/sim_i_eras.csv
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "outputs: Sim I $(date -u +%F)"
            for i in 1 2 3 4 5; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break; sleep 15; done
          fi
