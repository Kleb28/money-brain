name: sim-j

# Sim J (simulation/protocol.md): factor combination / optimization walk-forward -> outputs/sim_j.md
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-7pasfq]
    paths: [simulation/sim_j.py, .github/workflows/sim-j.yml]

permissions:
  contents: write

jobs:
  sim-j:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests yfinance
      - run: python -u -W ignore -m simulation.sim_j
      - name: Commit
        run: |
          git config user.name "money-brain-bot"
          git config user.email "money-brain-bot@users.noreply.github.com"
          git add outputs/sim_j.md
          [ -f data/external/sim_j_etf.csv.gz ] && git add data/external/sim_j_etf.csv.gz
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "outputs: Sim J factor combination walk-forward $(date -u +%F)"
            B="${GITHUB_REF_NAME}"
            for i in 1 2 3 4 5; do git pull --rebase origin "$B" && git push origin HEAD:"$B" && break; sleep 15; done
          fi
