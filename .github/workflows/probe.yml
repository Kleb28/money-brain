name: probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT }}
      USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas pyreadstat
      - run: python -u scripts/probe.py
      - name: Commit any fetched external data
        run: |
          git config user.name "money-brain-bot"
          git config user.email "money-brain-bot@users.noreply.github.com"
          git add data/external 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "data: external files fetched by probe $(date -u +%F)" && git push; fi
