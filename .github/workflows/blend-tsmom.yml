name: blend-tsmom

# Exploratory: 60/40 + TSMOM blend on 2002-2026 -> outputs/blend_tsmom.md
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-7pasfq]
    paths: [simulation/blend_tsmom.py, .github/workflows/blend-tsmom.yml]

permissions:
  contents: write

jobs:
  blend-tsmom:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests yfinance
      - run: python -u -W ignore -m simulation.blend_tsmom
      - name: Commit
        run: |
          git config user.name "money-brain-bot"
          git config user.email "money-brain-bot@users.noreply.github.com"
          git add outputs/blend_tsmom.md
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "outputs: 60-40 + TSMOM blend (exploratory) $(date -u +%F)"
            B="${GITHUB_REF_NAME}"
            for i in 1 2 3 4 5; do git pull --rebase origin "$B" && git push origin HEAD:"$B" && break; sleep 15; done
          fi
