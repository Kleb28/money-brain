name = "agent8k"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace id is filled in by the deploy workflow (wrangler kv namespace create).
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[vars]
NETWORK = "eip155:84532"   # Base Sepolia (test) until Caleb flips to eip155:8453
PRICE = "$0.03"
MODEL = "claude-haiku-5-5"
MAX_NEW_SUMMARIES_PER_DAY = "40"
# PAY_TO, EDGAR_USER_AGENT come from GitHub vars; ANTHROPIC_API_KEY, STATS_TOKEN, CDP_* are Worker secrets.
